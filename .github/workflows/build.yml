name: Build Cython Extension for Android/ARM

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython setuptools

    - name: Compile for ARM64 (Termux/Phone)
      run: |
        # সরাসরি টার্মিনাল কমান্ডের মাধ্যমে এআরএম (ARM64) আর্কিটেকচারের জন্য সাইথন বিল্ড করা
        cat << 'EOF' > build_arm.py
        from setuptools import setup
        from Cython.Build import cythonize
        setup(
            ext_modules = cythonize(["wifihack.py"])
        )
        EOF
        python build_arm.py build_ext --inplace

    - name: Upload compiled files
      uses: actions/upload-artifact@v4
      with:
        name: compiled-so-files-arm
        path: |
          *.so
          !setup.py
